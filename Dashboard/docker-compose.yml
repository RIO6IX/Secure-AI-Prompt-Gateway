services:
  detection-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure-ai-detection-engine
    environment:
      ENVIRONMENT: "production"
      DB_PATH: "/data/audit_logs.sqlite3"
      MAX_PROMPT_LENGTH: "50000"
      MAX_PROMPT_CHARS: "50000"
      MAX_BATCH_SIZE: "100"
      DEFAULT_MIN_CONFIDENCE: "0.35"
      ENTROPY_THRESHOLD: "3.7"
      ENABLE_NER: "true"
      ENABLE_METRICS: "true"
      LOG_LEVEL: "INFO"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "qwen2.5:3b"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET to a random value with at least 32 characters}"
      TOKEN_TTL_SECONDS: "${TOKEN_TTL_SECONDS:-43200}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      CORRELATION_SALT: "${CORRELATION_SALT:?Set CORRELATION_SALT to a random value}"
    ports:
      - "8000:8000"
    volumes:
      - audit-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.4.2
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - detection-engine

volumes:
  audit-data:
